name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  workflow-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce workflow job timeouts
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"

          max_timeout = 20
          errors = []
          files = Dir[".github/workflows/*.{yml,yaml}"].sort

          files.each do |path|
            workflow = YAML.safe_load(File.read(path), aliases: true) || {}
            jobs = workflow["jobs"]
            next unless jobs.is_a?(Hash)

            jobs.each do |job_name, job|
              unless job.is_a?(Hash)
                errors << "#{path}: job #{job_name} is not a mapping"
                next
              end

              timeout = job["timeout-minutes"]
              unless timeout.is_a?(Integer)
                errors << "#{path}: job #{job_name} must set a literal integer timeout-minutes"
                next
              end

              unless timeout.between?(1, max_timeout)
                errors << "#{path}: job #{job_name} timeout-minutes=#{timeout} exceeds policy maximum #{max_timeout}"
              end
            end
          end

          if errors.any?
            errors.each { |error| warn "::error::#{error}" }
            abort "Workflow timeout policy failed. Every job must use timeout-minutes: 1..#{max_timeout}."
          end

          puts "Workflow timeout policy passed for #{files.length} workflow file(s)."
          RUBY

  build:
    needs: workflow-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend production build
        run: npm run build
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
